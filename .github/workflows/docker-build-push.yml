name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs (the tag is in the trailing comment) so a moved
# or hijacked tag cannot run code with this workflow's package-write token.
jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      # Types only: lifecycle scripts (native rebuilds, standalone co-location) are not needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund

      # .source/ is generated by fumadocs-mdx during `next build`; src/lib/source.ts imports it.
      - name: Generate docs collections
        run: npx fumadocs-mdx

      - name: Type check (TypeScript 7)
        run: npm run typecheck

  build-and-push:
    name: Build & Push to GHCR
    needs: typecheck
    runs-on: ubuntu-latest
    # A memory-starved build can stall with no error; fail it instead of holding the runner
    # until the 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Expand Virtual Memory (Native 10GB Swap)
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare repository image name (lowercase)
        id: repo
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "Target image: ${IMAGE_NAME}:latest"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner-base
          # One page-data worker (the Dockerfile default is 2) peaks at ~4.3 GB versus 6.6 GB.
          # That fits the private-repo runner (2 CPUs / 8 GB). On a public repo's runner
          # (4 CPUs / 16 GB) the default of 2 fits too: raise it once a public build succeeds.
          build-args: |
            OMNIROUTE_BUILD_WORKERS=1
          push: true
          tags: |
            ${{ steps.repo.outputs.image }}:latest
            ${{ steps.repo.outputs.image }}:${{ github.sha }}
          # Stores the image layers only: BuildKit cache mounts (npm cache, .build/next/cache)
          # are not exported, so `npm ci` and `next build` start cold on every run.
          cache-from: type=gha
          cache-to: type=gha,mode=max
