# OmniRoute as a cluster on one host: ONE app container running a leader plus N workers under
# PM2 (ecosystem.config.cjs, fork mode, one port per process), PostgreSQL and Redis.
# NOT the live file yet: the cut-over runbook copies it over /opt/omniroute/docker-compose.yml.
#
#   omniroute   PM2 inside one container:
#                 leader     OMNIROUTE_ROLE=leader  migrations, background jobs, dashboard, the ONLY
#                            process that refreshes single-use OAuth tokens      127.0.0.1:20128
#                 worker-i   OMNIROUTE_ROLE=worker  serves requests               127.0.0.1:20200+i
#   postgres    all durable state (no published port; back up with `compose exec postgres pg_dump`)
#   redis       leader fence, cache-invalidation bus, per-account rate limiter (no published port).
#               Coordination falls back to PostgreSQL when REDIS_URL is unset; here it is set.
#
# Host Caddy: management plane (/dashboard*, /home*, /api/* except /api/v1/*, /live-ws*) -> 20128
# only; inference (/v1/*, /api/v1/*) -> 20128 and every worker port, with x-session-affinity.
#
# Order inside the container sorts itself out: the leader takes the fence and migrates; each
# worker waits until the database reaches its image's migration head. Operations:
#   docker exec omniroute pm2 ls | pm2 logs worker-0 | pm2 restart leader (never `pm2 reload leader`)
# The image HEALTHCHECK probes the leader (20128); PM2 restarts a dead worker and Caddy's
# per-upstream health checks take a stuck one out of rotation.
#
# /opt/omniroute/.env must hold (shared by every app container; a worker never generates them):
#   JWT_SECRET, API_KEY_SECRET, STORAGE_ENCRYPTION_KEY, STORAGE_ENCRYPTION_KEY_VERSION, MACHINE_ID_SALT,
#   OMNIROUTE_WS_BRIDGE_SECRET, INITIAL_PASSWORD, POSTGRES_PASSWORD, OMNIROUTE_TAG, and the public URL /
#   cookie / log settings listed in docker-compose.vps.yml. Never change STORAGE_ENCRYPTION_KEY.

name: omniroute

x-omniroute: &omniroute
  image: ghcr.io/zyndaai/omniroute:${OMNIROUTE_TAG:?set OMNIROUTE_TAG in .env to the commit sha to deploy}
  restart: always
  # The rehearsal points this at its own env file (docker-compose.rehearsal.yml).
  env_file: ${OMNIROUTE_ENV_FILE:-.env}
  environment: &omniroute-env
    OMNIROUTE_POSTGRES_URL: postgres://omniroute:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/omniroute
    REDIS_URL: redis://redis:6379
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  # Healthcheck comes from the image (node healthcheck.mjs, 30s interval).

services:
  postgres:
    image: postgres:18-alpine
    container_name: omniroute-postgres
    restart: always
    environment:
      POSTGRES_USER: omniroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omniroute
      # The schema requires the C collation (0001_init.sql guard): set it when the cluster is created.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - omniroute-pg:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniroute -d omniroute"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    container_name: omniroute-redis
    restart: always
    # Coordination state only (leases, limiter counters, pub/sub): nothing here must survive a
    # restart, so no persistence. noeviction: evicting a limiter or fence key would break limits.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  omniroute:
    <<: *omniroute
    container_name: omniroute
    # Leader + workers under PM2 instead of the image's single-process default command.
    command: ["pm2-runtime", "ecosystem.config.cjs"]
    environment:
      <<: *omniroute-env
      # Roles, instance ids and ports are assigned per process by ecosystem.config.cjs.
      OMNIROUTE_WORKERS: ${OMNIROUTE_WORKERS:-2}
      OMNIROUTE_LEADER_MEMORY_MB: ${OMNIROUTE_LEADER_MEMORY_MB:-1024}
      OMNIROUTE_WORKER_MEMORY_MB: ${OMNIROUTE_WORKER_MEMORY_MB:-768}
    # PM2's graceful stop gives each process 15 s (kill_timeout); leave Docker room for all of them.
    stop_grace_period: 30s
    ports:
      # Loopback only: Docker-published ports bypass UFW. One line per process; add worker
      # ports here when raising OMNIROUTE_WORKERS.
      - "127.0.0.1:20128:20128"
      - "127.0.0.1:20200:20200"
      - "127.0.0.1:20201:20201"
    volumes:
      # One DATA_DIR for every process: call-log bodies written by any process are read by the
      # dashboard on the leader.
      - omniroute-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # The live single-container volume (holds the SQLite file the transfer reads, kept for rollback).
  # External, or compose would create an empty `omniroute_omniroute-data` volume.
  omniroute-data:
    external: true
  omniroute-pg:
