# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — Self-Host Compose (零月费自托管 / zero-fee self-host)
# ──────────────────────────────────────────────────────────────────────
#  KISS: ONE command brings up the whole thing on loopback.
#
#    cp .env.selfhost.example .env   # set POSTGRES_PASSWORD, then the rest you want
#    docker compose -f docker-compose.selfhost.yml up -d
#    open http://127.0.0.1:20128
#
#  Three containers: omniroute (the app), postgres (all durable state) and
#  redis (cache and coordination). Neither database publishes a port.
#
#  No profiles, no build step, no multi-tenant anything.
#  Pulls the team image `ghcr.io/zyndaai/omniroute:latest`, built by
#  .github/workflows/docker-build-push.yml. The package is private: run
#  `docker login ghcr.io` with a token that has `read:packages` first.
#
#  All app ports bind to 127.0.0.1 ONLY by default (REQUIRE_API_KEY ships
#  as false). Set APP_BIND_HOST=0.0.0.0 in .env ONLY after you have set
#  REQUIRE_API_KEY=true OR put an auth-enforcing reverse proxy in front.
#  See docs/getting-started/SELF_HOST_GUIDE.md.
# ──────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    container_name: omniroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniroute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omniroute
      # The schema requires the C collation (0001_init.sql guard): set it when the
      # database is created. Changing it later means recreating the volume.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # No port published to the host. For psql or a backup, run
    #   docker exec -it omniroute-postgres psql -U omniroute omniroute
    #   docker exec omniroute-postgres pg_dump -U omniroute omniroute > omniroute.sql
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniroute -d omniroute"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: docker.io/library/redis:8.6.5-alpine
    container_name: omniroute-redis
    restart: unless-stopped
    # No port published to the host — the app reaches Redis over the compose
    # network (redis:6379). Publishing an unauthenticated Redis on 0.0.0.0
    # is a footgun we refuse to ship. If you need host-side redis-cli, run
    #   docker exec -it omniroute-redis redis-cli
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute:
    image: ghcr.io/zyndaai/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - DATA_DIR=/app/data
      - OMNIROUTE_POSTGRES_URL=postgres://omniroute:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/omniroute
      - REDIS_URL=redis://redis:6379
    ports:
      # Loopback-only by default. Override APP_BIND_HOST in .env to expose.
      - "${APP_BIND_HOST:-127.0.0.1}:${DASHBOARD_PORT:-20128}:${DASHBOARD_PORT:-20128}"
      - "${APP_BIND_HOST:-127.0.0.1}:${API_PORT:-20129}:${API_PORT:-20129}"
      - "${APP_BIND_HOST:-127.0.0.1}:${LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      # Default: bind-mount ./data on the host. Keep this line active so an
      # existing install keeps reading the same files after pulling this file.
      - ./data:/app/data
      # EACCES on the first write to /app/data? Some managed-deploy platforms
      # run the Docker daemon as root while the container runs as the
      # unprivileged `node` user (UID 1000), so a root-owned ./data is not
      # writable. Either `chown -R 1000:1000 ./data` on the host, or opt into
      # a Docker-managed named volume: comment the bind mount above, uncomment
      # the line below AND the `omniroute-data:` entry under `volumes:` at the
      # bottom. A named volume starts EMPTY and is not seen by a host-side
      # ./data backup — see docs/getting-started/SELF_HOST_GUIDE.md
      # ("Common issues") before switching an existing install.
      # - omniroute-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/dev/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  # Only needed if you opted into the named-volume alternative above.
  # omniroute-data:
